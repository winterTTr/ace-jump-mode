name: test

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # report every Emacs version, not just the first one to fail
      fail-fast: false
      matrix:
        emacs_version:
          # the oldest one Package-Requires claims
          - '24.4'
          - '31.1'
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}
      - run: make

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '31.1'
      - run: make lint
